# =============================================================================
# EGSA Space Academy — Production Nginx Reverse Proxy Configuration
# Same-origin routing for Shared Frontend and Independent Backends
# =============================================================================

# Upstream Service Definitions
upstream student_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream instructor_backend {
    server 127.0.0.1:5100 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream admin_backend {
    server 127.0.0.1:5200 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name academy.egsa.gov.eg staging-academy.egsa.gov.eg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name academy.egsa.gov.eg staging-academy.egsa.gov.eg;

    # SSL Certificates (Set by operator or Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/academy.egsa.gov.eg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.egsa.gov.eg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client payload size (accommodates student assessment PDF uploads)
    client_max_body_size 25M;

    # Root: Built Shared React / Vite Frontend
    root /var/www/egsa_academy/frontend/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Admin Backend API: /admin-api/* -> port 5200 (/api/*)
    location /admin-api/ {
        rewrite ^/admin-api/(.*)$ /api/$1 break;
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 2. Instructor Backend API: /api/v1/* -> port 5100 (/api/v1/*)
    location /api/v1/ {
        proxy_pass http://instructor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 3. Student Backend API: /api/* -> port 5000 (/api/*)
    location /api/ {
        proxy_pass http://student_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 4. Uploads Directory (protected media & certificate assets)
    location /uploads/ {
        proxy_pass http://student_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 304 12h;
    }

    # 5. Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 6. Single Page Application (SPA) Client-side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
