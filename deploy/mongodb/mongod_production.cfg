# =============================================================================
# EGSA Space Academy — Production MongoDB 8.2 Configuration
# Location: deploy/mongodb/mongod_production.cfg
# =============================================================================

# System Log Configuration
systemLog:
  destination: file
  path: "D:\\egsa_academy\\data\\mongodb\\log\\mongod.log"
  logAppend: true
  logRotate: reopen

# Storage Engine Configuration
storage:
  dbPath: "D:\\egsa_academy\\data\\mongodb\\db"
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2

# Process Management
processManagement:
  windowsService:
    serviceName: "EGSA_MongoDB"
    displayName: "EGSA Academy MongoDB Service"
    description: "Production MongoDB 8.2 Database Service for EGSA Academy Portals"

# Network Interfaces
net:
  port: 27017
  bindIp: 127.0.0.1
  maxIncomingConnections: 500

# Security Configuration
security:
  authorization: enabled
